[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "0.1.0"
description = "Offline desktop validator for large Serial and QR datasets"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "openpyxl>=3.1,<4",
  "psutil>=6,<8",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pyinstaller>=6.10,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
data-validator = "data_validator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
