name: Test and Build Windows

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest -q

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and smoke test
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DataValidator-Windows-x64
          path: dist/DataValidator-Windows-x64.zip
          if-no-files-found: error
